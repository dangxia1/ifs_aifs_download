<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大气河短期预报支撑平台 ARFS</title>
<!--
  ARFS HTML 展示页 (v2.9, 2026-08-07)
  - 单文件纯 HTML+CSS+JS, 零第三方依赖, 全离线可用
  - 设计纪律 (frontend-design skill):
    Design Read: 操作型气象数据查看器, 面向老预报员的深色科学仪器风格
    旋钮: VARIANCE 4 / MOTION 4 / DENSITY 6; 全页单主题深色 (用户指定),
    单一琥珀强调色 (与卫星蓝底图互补, 不与数据红点撞色)
  - 路径探测: viewer.html 可能放在 项目根 / 数据根 / 绿包 data/ 三种位置,
    图片与 run_time.json 按候选前缀逐一探测, 首中缓存 (2026-08-07 bug 修复)
  - 背景图: 探测 背景.jpg (数据根) → docs/背景.jpg (项目根), 叠加暗化渐变,
    缺失自动回退深色底色 (还原 streamlit 时代的背景效果)
  - v2.3 (2026-08-07, 绿包三问题): ① 播放动画预载后续帧 + 保留上一帧,
    大图加载慢不再"隔两张黑一下" ② step 防御回退 + 骨架/提示覆盖图片区,
    杜绝 stepundefined 黑框 ③ 删除时序图下方解释文字
  - v2.4 (2026-08-07): 图片加载失败静默处理, 不再显示任何报错文字 (老师要求)
  - v2.5 (2026-08-07): 连"未找到图片数据目录"提示一并删除 — 无数据时完全静默
  - v2.6 (2026-08-07, 真正根因): "未找到图片数据目录 (figures/)"是 placeholder 元素的
    静态默认文字, 而 .placeholder 的 display:flex 覆盖了 UA 的 [hidden]{display:none}
    → 该文字从首版起就永远悬浮在每张图片正中。修复: 元素整个删除 (HTML+CSS+JS), 物理消除
  - v2.7 (2026-08-07): 图例同步图片渲染层 — 候选分支空心点改粉色 (与主链红色区分),
    降水四色改色相拉开组 (草绿/青/紫/品红), 与 config_realtime.yaml visual.precip_colors 一致
  - v2.8 (2026-08-07): 标题补英文全称 Atmospheric River Forecast Support, 与中文同大小 (老师要求)
  - v2.9 (2026-08-07): 主标题青蓝渐变文字 (老师要求) + 图片显示缩为 0.9 倍居中 (@supports 回退白字)
-->
<style>
  :root {
    /* 中性深色底座 (非纯黑), 单一琥珀强调色 */
    --bg: #0a0e14;
    --panel: #141a24;
    --panel-2: #1a2230;
    --line: #232c3a;
    --text: #e8ecf2;
    --sub: #98a2b3;
    --accent: #e8b34b;
    --accent-hi: #f0c468;
    --accent-soft: rgba(232, 179, 75, .14);
    /* 圆角系统: 按钮/胶囊 999px, 卡片/输入 10px, 小元素 6px */
    --r-pill: 999px;
    --r-card: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  body {
    background-color: var(--bg);
    /* 底色备一层暗蓝微光, 背景图由 JS 探测成功后叠加 */
    background-image: radial-gradient(1200px 500px at 50% -10%, rgba(42, 58, 82, .35), transparent 70%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace; font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1560px; margin: 0 auto; padding: 22px 26px 8px; }

  /* ── 头部: 标题左, 起报时间右 ── */
  header { display: flex; align-items: flex-end; justify-content: space-between;
           gap: 16px; flex-wrap: wrap; padding-bottom: 14px; }
  /* v2.9: 标题青蓝渐变文字 (老师要求 2026-08-07); 不支持 text-clip 时回退白字 */
  h1 {
    font-size: 2.6rem; font-weight: 700; letter-spacing: -0.01em;
    color: #f2f5f9; line-height: 1.25;
    background: linear-gradient(90deg, #26C6DA 0%, #1565C0 100%);
    -webkit-background-clip: text; background-clip: text;
  }
  @supports (background-clip: text) or (-webkit-background-clip: text) {
    h1, h1 .en { color: transparent; }
  }
  /* v2.8: 英文全称与中文标题同大小 (老师要求) */
  h1 .en { font-weight: 500; color: var(--sub); font-size: 2.6rem; letter-spacing: .08em; }
  /* 测试版徽标: 小号琥珀描边胶囊, 挂在标题右侧 */
  .beta {
    display: inline-block; vertical-align: middle; margin-left: 14px;
    font-size: 1.15rem; font-weight: 700; color: var(--accent-hi);
    border: 2px solid var(--accent); border-radius: var(--r-pill);
    padding: 3px 14px; letter-spacing: .04em;
  }
  .sub { font-size: 1.2rem; color: var(--sub); margin-top: 4px; }
  .rt-label { display: block; font-size: 1.05rem; color: var(--sub);
              text-transform: uppercase; letter-spacing: .14em; text-align: right; }
  .rt-value { display: block; font-size: 1.9rem; font-weight: 700; color: var(--accent-hi); margin-top: 2px; }

  /* ── Tab 分段控件 ── */
  .seg { display: inline-flex; gap: 4px; background: var(--panel);
         border: 1px solid var(--line); border-radius: var(--r-pill);
         padding: 4px; margin: 4px 0 2px; }
  .seg-btn {
    border: none; background: transparent; color: var(--sub);
    font: 700 28px/1.2 inherit; padding: 12px 28px; border-radius: var(--r-pill);
    cursor: pointer; transition: color .15s ease, background .15s ease;
  }
  .seg-btn:hover { color: var(--text); }
  .seg-btn.active { background: var(--accent-soft); color: var(--accent-hi); }

  /* ── 区域胶囊 ── */
  .pills { display: flex; gap: 8px; margin: 8px 0 2px; }
  .pill {
    border: 1px solid var(--line); background: var(--panel); color: var(--sub);
    font: 700 22px/1.2 inherit; padding: 8px 22px; border-radius: var(--r-pill);
    cursor: pointer; transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .pill:hover { color: var(--text); border-color: #33415a; }
  .pill.active { border-color: var(--accent); color: var(--accent-hi); background: var(--accent-soft); }

  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:active { transform: scale(.97); }
  button { transition: transform .1s ease; }

  /* ── 主区: 图 + 右面板 ── */
  main { display: flex; gap: 18px; align-items: flex-start; margin-top: 8px; }
  .img-col { flex: 1; min-width: 0; }
  .view {
    position: relative;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-card); overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35); /* 阴影染底色, 非纯黑 */
  }
  /* 图按原始宽高比自然显示, 图有多大显示多大 (2026-08-07 v2.2:
     弃用 16/9 固定容器, 图片显示面积显著扩大) */
  .view { min-height: 420px; }   /* 无图/加载时兜底高度 (v2.3) */
  .view img { display: block; width: 90%; height: auto; margin: 0 auto;  /* v2.9: 图 0.9 倍居中 */
              opacity: 0; transition: opacity .3s ease; }
  .view img.ready { opacity: 1; }
  /* 骨架/提示覆盖在图片区域上 (v2.3: 不再在图片下方多出一个黑框) */
  .skeleton {
    position: absolute; inset: 0;
    background: linear-gradient(110deg, var(--panel) 40%, var(--panel-2) 50%, var(--panel) 60%);
    background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }
  /* v2.6: placeholder 元素已整个删除 — 其静态文字"未找到图片数据目录"曾因
     display:flex 覆盖 UA 的 [hidden]{display:none} 而永远悬浮在图片正中 */

  /* ── 图例 ── */
  .legend {
    margin-top: 12px; padding: 12px 18px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-card); font-size: 20px; color: var(--text); line-height: 2.1;
  }
  .legend .row { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
  .dot { display: inline-block; width: 15px; height: 15px; border-radius: 50%;
         vertical-align: middle; margin-right: 6px; }
  .ring { display: inline-block; width: 15px; height: 15px; border-radius: 50%;
          border: 2px solid #ff69b4; vertical-align: middle; margin-right: 6px; }  /* v2.7: 粉, 与主链红色区分 */
  .sw { display: inline-block; width: 15px; height: 15px; border-radius: 3px;
        vertical-align: middle; margin-right: 6px; }
  .cross { color: #fff; text-shadow: -1px 0 #000, 1px 0 #000, 0 -1px #000, 0 1px #000;
           font-weight: 700; margin-right: 4px; }
  .dl { color: var(--accent-hi); font-size: 20px; text-decoration: none; }
  .dl:hover { text-decoration: underline; }

  /* ── 右侧面板 ── */
  .side {
    width: 250px; flex-shrink: 0;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--r-card); padding: 14px;
    position: sticky; top: 16px;
  }
  .play-row { display: flex; gap: 12px; align-items: center; }
  .play-btn {
    width: 60px; height: 60px; flex-shrink: 0; border-radius: 50%;
    border: 2px solid var(--line); background: var(--panel-2); color: var(--text);
    font-size: 1.35rem; cursor: pointer;
  }
  .play-btn:hover { color: var(--accent-hi); border-color: var(--accent); }
  .prog { flex: 1; height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; }
  .prog-fill { height: 100%; width: 0%; background: var(--accent);
               transition: width .4s linear; }
  .prog-text { font-size: 17px; color: var(--sub); text-align: center; margin-top: 6px; }
  .side h3 { font-size: 23px; font-weight: 700; margin: 12px 0 2px; color: var(--text); }
  .side .meta { font-size: 17px; color: var(--sub); margin-bottom: 8px; }
  .step-list {
    max-height: 460px; overflow-y: auto;
    display: flex; flex-direction: column; gap: 3px; padding-right: 4px;
  }
  .step-btn {
    width: 100%; text-align: left; border: none; background: transparent;
    color: var(--text); font-weight: 700; font-size: 24px; line-height: 1.3;
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    font-variant-numeric: tabular-nums;
    padding: 10px 16px; border-radius: 6px; cursor: pointer;
    border-left: 2px solid transparent;
  }
  .step-btn:hover { background: var(--panel-2); }
  .step-btn.active { background: var(--accent-soft); color: var(--accent-hi); border-left-color: var(--accent); }
  .step-list::-webkit-scrollbar { width: 8px; }
  .step-list::-webkit-scrollbar-thumb { background: #2a3644; border-radius: 4px; }
  .step-list::-webkit-scrollbar-track { background: transparent; }

  /* 页脚样式已随页脚删除 (2026-08-07) */

  @media (prefers-reduced-motion: reduce) {
    .skeleton { animation: none; }
    .view img { transition: none; }
    button { transition: none; }
  }
  @media (max-width: 900px) {
    main { flex-direction: column; }
    .side { width: 100%; position: static; }
    h1 { font-size: 1.9rem; }
    .seg-btn { font-size: 24px; padding: 10px 20px; }
    .pill { font-size: 20px; padding: 7px 18px; }
    .step-btn { font-size: 21px; }
    .rt-label, .rt-value { text-align: left; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>大气河短期预报支撑平台<br>
        <span class="en">Atmospheric River Forecast Support (ARFS)</span><span class="beta">(测试版)</span></h1>
      <p class="sub">IFS 数值预报 对比 AIFS 人工智能预报 · 全球 / 东亚 / 华北</p>
    </div>
    <div>
      <span class="rt-label">起报时间 (北京时间)</span>
      <span class="rt-value mono" id="rt-value">加载中…</span>
    </div>
  </header>

  <nav class="seg" id="tab-bar" role="tablist">
    <button class="seg-btn active" role="tab" aria-selected="true" data-tab="map">预报图</button>
    <button class="seg-btn" role="tab" aria-selected="false" data-tab="ts">北京地区时序图</button>
  </nav>

  <div class="pills" id="region-bar" role="tablist">
    <button class="pill active" role="tab" aria-selected="true" data-region="global">全球</button>
    <button class="pill" role="tab" aria-selected="false" data-region="east_asia">东亚</button>
    <button class="pill" role="tab" aria-selected="false" data-region="north_china">华北</button>
  </div>

  <main>
    <div class="img-col">
      <div class="view">
        <img id="main-img" alt="预报图">
        <div class="skeleton" id="skeleton" hidden></div>
      </div>

      <!-- 图例说明 (预报图) -->
      <div class="legend" id="legend-map">
        <div class="row">
          <span><span class="dot" style="background:#ff0000"></span>大气河河轴 (主链)</span>
          <span><span class="ring"></span>候选分支 (被过滤)</span>
          <span><span class="cross">✚</span>大气河质心</span>
        </div>
        <div class="row">
          <!-- v2.7: 降水四色与 config_realtime.yaml visual.precip_colors 同步 -->
          <span><span class="dot" style="background:#8BC34A"></span>大雨</span>
          <span><span class="dot" style="background:#00BCD4"></span>暴雨</span>
          <span><span class="dot" style="background:#9C27B0"></span>大暴雨</span>
          <span><span class="dot" style="background:#FF4081"></span>特大暴雨</span>
        </div>
        <div class="row">
          <span>水汽通量 (IVT): 半透明区域未识别出大气河, 不透明区域为大气河</span>
          <a class="dl" id="dl-link" href="#" download>查看原图</a>
        </div>
      </div>

      <!-- 时序图说明已按用户要求删除 (v2.3, 2026-08-07) -->
    </div>

    <aside class="side">
      <div class="play-row">
        <button class="play-btn" id="play-btn" title="播放动画 (0.4 秒每帧)">▶</button>
        <div class="prog"><div class="prog-fill" id="prog-fill"></div></div>
      </div>
      <div class="prog-text mono" id="prog-text">就绪</div>
      <h3>预报时次</h3>
      <p class="meta mono">25 帧 · 每 6 小时 · 0-144h</p>
      <div class="step-list" id="step-list"></div>
    </aside>
  </main>

  <!-- 页脚说明已按用户要求删除 (2026-08-07) -->
</div>

<script>
"use strict";
const REGIONS = { global: "全球", east_asia: "东亚", north_china: "华北" };
// 25 个时次: 0~144h 每 6h
const STEPS = Array.from({ length: 25 }, (_, i) => i * 6);
const PLAY_MS = 400;

const $ = id => document.getElementById(id);
const img = $("main-img"), skel = $("skeleton");   // v2.6: placeholder 已删
const dlLink = $("dl-link");

let figBase = null;   // 探测成功后的图片前缀: '' / 'data/' / '../' / '../data/'
let runTime = null;
let tab = "map", region = "global", step = 0, playing = false, timer = null;
let hasFrame = false; // 是否已有可见帧 (v2.3: 切图时保留上一帧, 避免黑闪)

/* ── 路径探测: 兼容 项目根 / 数据根 / 绿包 data/ 三种放置方式 ── */
function okImage(src) {
  return new Promise(res => {
    const im = new Image();
    im.onload = () => res(true);
    im.onerror = () => res(false);
    im.src = src;
  });
}
async function probeFigBase() {
  const probe = "figures/global/step0.png";
  for (const c of [probe, "data/" + probe, "../" + probe, "../data/" + probe]) {
    if (await okImage(c)) return c.replace("figures/global/step0.png", "");
  }
  return null;
}
async function loadRunTime() {
  for (const c of ["run_time.json", "data/run_time.json",
                   "../run_time.json", "../data/run_time.json"]) {
    try {
      const r = await fetch(c, { cache: "no-store" });
      if (!r.ok) continue;
      const j = await r.json();
      if (j && j.run_time) { runTime = j.run_time; break; }
    } catch (e) { /* file:// 下 fetch 被拦 → 试下一候选 */ }
  }
  const v = $("rt-value");
  v.textContent = runTime ? runTime + " (北京时间)" : "未知 · 请通过数据目录访问";
}
async function loadBg() {
  // 暗化背景 (还原 streamlit 时代的 docs/背景.jpg); 找不到时保留深色底色
  const scrim = "linear-gradient(rgba(10,14,20,.88), rgba(10,14,20,.88))";
  for (const c of ["背景.jpg", "data/背景.jpg", "docs/背景.jpg",
                   "../docs/背景.jpg", "../data/背景.jpg"]) {
    if (await okImage(c)) {
      document.body.style.backgroundImage = scrim + ", url('" + encodeURI(c) + "')";
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      document.body.style.backgroundAttachment = "fixed";
      return;
    }
  }
}

/* step → 预报时间 'MM/DD HH:00' (run_time 为北京时间; 本地时区为北京时间时正确) */
function validLabel(s) {
  if (!runTime) return "step" + s;
  const [d, t] = runTime.split(" ");
  const [y, m, dd] = d.split("-").map(Number);
  const hh = Number(t.slice(0, 2));
  const vt = new Date(y, m - 1, dd, hh + s);
  return String(vt.getMonth() + 1).padStart(2, "0") + "/" +
         String(vt.getDate()).padStart(2, "0") + " " +
         String(vt.getHours()).padStart(2, "0") + ":00";
}

/* ── 渲染右侧时次按钮 ── */
function renderSteps() {
  const box = $("step-list");
  box.innerHTML = "";
  for (const s of STEPS) {
    const b = document.createElement("button");
    b.className = "step-btn" + (s === step ? " active" : "");
    b.textContent = validLabel(s);
    b.onclick = () => { if (!playing) { step = s; go(); } };
    box.appendChild(b);
  }
}
function refreshSteps() {
  [...document.querySelectorAll(".step-btn")].forEach((b, i) => {
    b.textContent = validLabel(STEPS[i]);
    b.classList.toggle("active", STEPS[i] === step);
  });
}

/* ── 图片显示 (skeleton 占位 → 淡入; 失败 → 错误提示) ──
   smooth: 已有可见帧时保留旧帧直到新帧加载完, 不闪黑 (v2.3) */
function showImage(src, smooth = false) {
  if (!smooth) { skel.hidden = false; img.classList.remove("ready"); }
  img.onload = () => { skel.hidden = true; img.classList.add("ready"); hasFrame = true; };
  img.onerror = () => {
    skel.hidden = true;   // v2.4: 加载失败静默处理, 不显示任何报错文字 (老师要求)
  };
  img.src = src;
}
function noDataMsg() {
  // v2.5: 无数据时完全静默 — 不显示任何提示文字 (老师要求); v2.6: placeholder 已删
  skel.hidden = true; img.classList.remove("ready");
}
function renderImg() {
  if (figBase === null) { noDataMsg(); return; }
  if (!STEPS.includes(step)) step = STEPS[0];   // 防御: step 异常回退首帧 (v2.3)
  const src = figBase + "figures/" + region + "/step" + step + ".png";
  dlLink.href = src;
  dlLink.download = region + "_step" + step + ".png";
  showImage(src, hasFrame);
}

/* ── Tab 切换 (v2.3: 时序图下方解释已删) ── */
function showTs() {
  tab = "ts";
  $("region-bar").hidden = true;
  $("legend-map").hidden = true;
  document.querySelectorAll("#tab-bar .seg-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === "ts");
    b.setAttribute("aria-selected", b.dataset.tab === "ts");
  });
  if (figBase !== null) showImage(figBase + "figures/north_china_timeseries.png", hasFrame);
  else noDataMsg();
  syncHash();
}
function showMap() {
  tab = "map";
  $("region-bar").hidden = false;
  $("legend-map").hidden = false;
  document.querySelectorAll("#tab-bar .seg-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === "map");
    b.setAttribute("aria-selected", b.dataset.tab === "map");
  });
  renderImg();
  syncHash();
}

function go() { renderImg(); refreshSteps(); syncHash(); }

/* ── URL hash 同步: #map/global/step6 | #ts ── */
function syncHash() {
  if (tab === "ts") { location.hash = "#ts"; return; }
  location.hash = "#" + tab + "/" + region + "/step" + step;
}
function parseHash() {
  const h = location.hash.replace(/^#/, "");
  if (h === "ts") { tab = "ts"; return; }
  const parts = h.split("/");
  const t = parts[0] || "map", r = parts[1] || "global", s = parts[2];
  if (t === "map") {
    tab = "map";
    if (REGIONS[r]) region = r;
    if (s && STEPS.includes(Number(s.replace("step", ""))))
      step = Number(s.replace("step", ""));
  }
}
function applyHash() {
  if (playing) return;
  parseHash();
  document.querySelectorAll("#tab-bar .seg-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.tab === tab));
  $("region-bar").hidden = (tab !== "map");
  $("legend-map").hidden = (tab !== "map");
  document.querySelectorAll("#region-bar .pill").forEach(b =>
    b.classList.toggle("active", b.dataset.region === region));
  if (tab === "ts") {
    if (figBase !== null) showImage(figBase + "figures/north_china_timeseries.png", hasFrame);
    else noDataMsg();
  } else {
    renderImg();
  }
  renderSteps();
}
window.addEventListener("hashchange", applyHash);

/* ── Tab / 区域按钮事件绑定 (v2.2 修复: v2 重写时丢失, 导致点击无效) ── */
document.querySelectorAll("#tab-bar .seg-btn").forEach(b =>
  b.onclick = () => { if (playing) return; b.dataset.tab === "ts" ? showTs() : showMap(); });
document.querySelectorAll("#region-bar .pill").forEach(b =>
  b.onclick = () => { if (playing) return; region = b.dataset.region; go(); });

/* ── 播放动画 (v2.3: 预载后续帧 + 保留上一帧直到新帧加载完, 不再每隔几张黑一下) ── */
const playBtn = $("play-btn");
const progFill = $("prog-fill");
const progText = $("prog-text");
const preloaded = {};   // "region:step" → Image (已开始加载的帧)
function frameSrc(s) { return figBase + "figures/" + region + "/step" + s + ".png"; }
function preloadFrame(s) {
  const key = region + ":" + s;
  if (figBase === null || preloaded[key] || s === step) return;
  const im = new Image();
  im.src = frameSrc(s);
  preloaded[key] = im;
}
function stopPlay() { playing = false; clearInterval(timer); playBtn.textContent = "▶"; }
function togglePlay() {
  if (tab !== "map" || figBase === null) return;
  if (playing) { stopPlay(); return; }
  playing = true; playBtn.textContent = "⏸";
  let i = STEPS.indexOf(step);
  if (i < 0) { step = STEPS[0]; i = 0; }
  // 先预载之后 3 帧 (覆盖大图加载延迟), 播放中逐帧续载
  for (let k = i; k < Math.min(i + 3, STEPS.length); k++) preloadFrame(STEPS[k]);
  const tick = () => {
    step = STEPS[i];
    const src = frameSrc(step);
    dlLink.href = src;
    dlLink.download = region + "_step" + step + ".png";
    showImage(src, hasFrame);   // 有可见帧 → 保留旧帧平滑切换
    refreshSteps();
    progFill.style.width = ((i + 1) / STEPS.length * 100) + "%";
    progText.textContent = "第 " + (i + 1) + "/" + STEPS.length + " 帧 · " + validLabel(step);
    const ahead = STEPS[i + 3];
    if (ahead !== undefined) preloadFrame(ahead);
    i++;
    if (i >= STEPS.length) {
      stopPlay();
      progText.textContent = "播放完成";
      progFill.style.width = "100%";
    }
  };
  tick();
  timer = setInterval(tick, PLAY_MS);
}
playBtn.onclick = togglePlay;

/* ── 初始化: 先探测路径, 再渲染 (加载失败显示提示) ── */
(async function init() {
  const [fb] = await Promise.all([probeFigBase(), loadRunTime(), loadBg()]);
  figBase = fb;  // 首候选命中时为空字符串 "" (合法), 失败才是 null
  renderSteps(); // 探测失败也渲染时次按钮, 点击时显示提示, UI 不失效
  applyHash();
})();
</script>
